<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>双对话协作</title>
  <style>
/*__COLLAB_APP_CSS__*/
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <header class="hero">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <rect x="3" y="8" width="28" height="20" rx="8"></rect>
            <path d="M10 28v7l8-6"></path>
            <rect x="19" y="19" width="26" height="18" rx="8"></rect>
            <path d="M36 37v6l-7-5"></path>
          </svg>
        </div>
        <div>
          <h1>双对话协作</h1>
          <p class="subtitle">项目经理线程 · 多员工线程 · 项目任务板</p>
        </div>
      </div>
      <div class="hero-actions">
        <span class="status-pill"><span class="dot"></span><span id="healthText">正在连接 Codex</span></span>
        <button class="button" id="fullscreenButton" type="button" hidden>全屏</button>
        <button class="button" id="refreshButton" type="button">刷新</button>
      </div>
    </header>

    <section class="stats" aria-label="协作概览">
      <div class="stat"><div class="stat-label">进行中</div><div class="stat-value" id="activeCount">0</div></div>
      <div class="stat"><div class="stat-label">等待回报</div><div class="stat-value" id="waitingCount">0</div></div>
      <div class="stat"><div class="stat-label">空闲员工</div><div class="stat-value" id="idleCount">0</div></div>
      <div class="stat"><div class="stat-label">全部任务</div><div class="stat-value" id="totalCount">0</div></div>
    </section>

    <section class="panel board-panel">
      <div class="panel-head">
        <div>
          <h2>全部任务</h2>
          <p id="generatedAt">正在读取状态…</p>
        </div>
        <div class="filters" role="group" aria-label="任务筛选">
          <button class="filter active" data-filter="all" type="button">全部</button>
          <button class="filter" data-filter="active" type="button">进行中</button>
          <button class="filter" data-filter="waiting" type="button">等待回报</button>
          <button class="filter" data-filter="idle" type="button">空闲</button>
          <button class="filter" data-filter="done" type="button">已结束</button>
        </div>
      </div>
      <div class="task-list" id="taskList" aria-live="polite">
        <div class="empty"><strong>正在加载</strong><span>请稍候…</span></div>
      </div>
    </section>

    <section class="drawers" aria-label="协作操作">
      <details class="panel">
        <summary>派发下一轮</summary>
        <form class="form-grid" id="dispatchForm">
          <div class="field">
            <label for="dispatchManager">项目经理线程 ID</label>
            <input class="input" id="dispatchManager" name="managerThreadId" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="dispatchWorker">员工线程</label>
            <select class="input" id="dispatchWorker" name="worker" required>
              <option value="">先关联一个员工</option>
            </select>
          </div>
          <div class="field full">
            <label for="dispatchTask">本轮任务</label>
            <textarea class="input" id="dispatchTask" name="task" required placeholder="写清目标、范围和交付物"></textarea>
          </div>
          <div class="field full">
            <label for="dispatchAcceptance">验收标准</label>
            <textarea class="input" id="dispatchAcceptance" name="acceptance" placeholder="可选；写明如何验收"></textarea>
          </div>
          <div class="form-actions">
            <button class="button primary" type="submit">派发本轮</button>
            <span class="muted">默认通过 codex queue 或跨设备中继自动发送。</span>
          </div>
          <div class="result" id="dispatchResult" hidden>
            <strong id="dispatchResultTitle">本轮提示词</strong>
            <textarea class="input" id="dispatchMessage" readonly></textarea>
            <div class="form-actions">
              <button class="button" id="copyDispatch" type="button">复制提示词</button>
              <span class="muted">仅在自动发送失败时需要。</span>
            </div>
          </div>
        </form>
      </details>

      <details class="panel">
        <summary>关联员工线程</summary>
        <form class="form-grid" id="linkForm">
          <div class="field">
            <label for="linkManager">项目经理线程 ID</label>
            <input class="input" id="linkManager" name="currentThreadId" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="linkManagerTitle">项目经理标题</label>
            <input class="input" id="linkManagerTitle" name="currentTitle" autocomplete="off" placeholder="可选">
          </div>
          <div class="field">
            <label for="linkWorker">员工线程 ID</label>
            <input class="input" id="linkWorker" name="peerThreadId" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="linkWorkerTitle">员工标题</label>
            <input class="input" id="linkWorkerTitle" name="peerTitle" autocomplete="off" placeholder="可选">
          </div>
          <div class="field">
            <label for="linkProject">项目名称</label>
            <input class="input" id="linkProject" name="projectName" autocomplete="off" placeholder="可选；默认使用经理标题">
          </div>
          <div class="field">
            <label for="linkMode">关联模式</label>
            <select class="input" id="linkMode" name="mode">
              <option value="temporary">临时：收尾后自动解绑</option>
              <option value="permanent">永久：保留关联与历史</option>
            </select>
          </div>
          <div class="field full">
            <label for="linkGoal">项目总目标</label>
            <input class="input" id="linkGoal" name="goal" autocomplete="off" placeholder="可选；后续轮次会沿用">
          </div>
          <div class="form-actions">
            <button class="button primary" type="submit">建立关联</button>
            <span class="muted">已有线程 ID 可从 Codex 的线程列表获取。</span>
          </div>
        </form>
      </details>

      <details class="panel">
        <summary>项目与运行设置</summary>
        <form class="form-grid" id="configForm">
          <div class="field">
            <label for="configManager">项目经理线程 ID</label>
            <input class="input" id="configManager" name="managerThreadId" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="configProject">项目名称</label>
            <input class="input" id="configProject" name="projectName" autocomplete="off">
          </div>
          <div class="field">
            <label for="configLanguage">消息语言</label>
            <select class="input" id="configLanguage" name="language">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="field">
            <label for="configRounds">最大轮次（0 = 不限制）</label>
            <input class="input" id="configRounds" name="maxRounds" type="number" min="0" max="200" value="0">
          </div>
          <div class="field">
            <label for="configNudge">停滞提醒间隔（分钟）</label>
            <input class="input" id="configNudge" name="nudgeAfterMinutes" type="number" min="5" max="1440" value="20">
          </div>
          <div class="field">
            <label for="configAutoSend">自动派发</label>
            <select class="input" id="configAutoSend" name="autoSend">
              <option value="true">开启</option>
              <option value="false">关闭</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="button primary" type="submit">保存设置</button>
            <button class="button" id="openNativeButton" type="button">打开原生窗口</button>
          </div>
        </form>
      </details>

      <details class="panel">
        <summary>跨设备中继</summary>
        <form class="form-grid" id="relayForm">
          <div class="field">
            <label for="hubUrl">Hub URL</label>
            <input class="input" id="hubUrl" name="hubUrl" type="url" placeholder="https://hub.example.com">
          </div>
          <div class="field">
            <label for="hubRoom">房间</label>
            <input class="input" id="hubRoom" name="hubRoom" autocomplete="off" placeholder="default">
          </div>
          <div class="field">
            <label for="hubToken">共享 Token</label>
            <input class="input" id="hubToken" name="hubToken" type="password" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="deviceName">本设备名</label>
            <input class="input" id="deviceName" name="deviceName" autocomplete="off" placeholder="desktop">
          </div>
          <div class="form-actions">
            <button class="button primary" type="submit">保存中继</button>
            <span class="muted" id="relaySummary">尚未读取中继状态</span>
          </div>
        </form>
        <div class="divider"></div>
        <form class="form-grid" id="aliasForm">
          <div class="field">
            <label for="aliasSession">本机员工线程 ID</label>
            <input class="input" id="aliasSession" name="session" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="aliasName">远程别名</label>
            <input class="input" id="aliasName" name="alias" autocomplete="off" placeholder="frontend" required>
          </div>
          <div class="form-actions">
            <button class="button" type="submit">注册本机别名</button>
          </div>
        </form>
        <div class="divider"></div>
        <form class="form-grid" id="remoteLinkForm">
          <div class="field">
            <label for="remoteManager">项目经理线程 ID</label>
            <input class="input" id="remoteManager" name="managerThreadId" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="remoteDevice">远端设备名</label>
            <input class="input" id="remoteDevice" name="device" autocomplete="off" placeholder="laptop" required>
          </div>
          <div class="field">
            <label for="remoteWorker">远端别名</label>
            <input class="input" id="remoteWorker" name="worker" autocomplete="off" placeholder="frontend" required>
          </div>
          <div class="field">
            <label for="remoteName">显示名</label>
            <input class="input" id="remoteName" name="name" autocomplete="off" placeholder="前端">
          </div>
          <div class="field">
            <label for="remoteMode">关联模式</label>
            <select class="input" id="remoteMode" name="mode">
              <option value="temporary">临时</option>
              <option value="permanent">永久</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="button primary" type="submit">关联远端员工</button>
          </div>
        </form>
      </details>
    </section>

    <footer class="footnote">
      <span id="storagePath"></span>
      <span>MCP App · 状态保存在本机</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
/*__MCP_APPS_BUNDLE__*/
/*__COLLAB_APP_JS__*/
  </script>
</body>
</html>
